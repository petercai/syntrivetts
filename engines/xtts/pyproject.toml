[build-system]
requires = ["setuptools >= 64"]
build-backend = "setuptools.build_meta"

[project]
name = "syntrive-tts-engine-xtts"
version = "0.0.0"
description = "Isolated Out-of-Process Worker environment for the XTTS TTS engine. See docs/tts-worker/TTS-Worker-Architecture-DESIGN-2026-07-27.md Section 4."
requires-python = ">=3.11,<3.12"
dependencies = [
    "coqui-tts[languages]",
    "transformers<5",
]

[project.optional-dependencies]
cpu = ["torch==2.8.*", "torchaudio==2.8.*"]
cuda = ["torch==2.8.*", "torchaudio==2.8.*"]

[tool.uv]
conflicts = [[{ extra = "cpu" }, { extra = "cuda" }]]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", extra = "cpu" }]
torchaudio = [{ index = "pytorch-cpu", extra = "cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
