[build-system]
requires = ["setuptools >= 64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["syntrive*", "audio_review*"]

[tool.setuptools.package-data]
"syntrive.contract" = ["schemas/*.json"]

[project]
name = "SyntriveTTS"
version = "0.8.0"
description = "A local, multi-engine neural text-to-speech production platform."
authors = [
    { name = "Peter Cai" }
]
dependencies = [
	"beautifulsoup4",
	"ebooklib",
	"mutagen",
	"pyyaml",
	"regex",
	"tqdm",
	"torch",
	"numpy",
	"huggingface-hub[hf-xet]",
	"ffmpeg-python>=0.2.0",
	"soundfile>=0.13.1",
	"sqlalchemy>=2.0.45",
	"textual>=8.2.7",
	"sounddevice>=0.5.5",
	"faster-whisper>=1.0.0",
	"typer>=0.15.1",
	"textual-autocomplete>=4.0.6",
	"questionary>=2.1.1",
	"pillow>=12.3.0",
]
readme = "README.md"
requires-python = ">=3.14,<3.15"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
scripts = { "syntrive" = "syntrive.cli_entry:main" }

[project.urls]
"Homepage" = "https://github.com/petercai/syntrivetts"

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "pyyaml",
    "jsonschema>=4.26.0",
    "httpx2",
]
tools = [
	"pydub",
	"audioop-lts; python_version >= '3.13'",
	"pathspec>=1.1.1",
]
player = [
	"fastapi>=0.141.0",
	"uvicorn>=0.32.0",
]
webui = [
	"fastapi>=0.141.0",
	"uvicorn>=0.32.0",
	"jinja2>=3.1",
	"python-multipart>=0.0.20",
]
mcp = [
    "mcp>=2.2",
]
e2e = [
    "playwright>=1.50",
]
